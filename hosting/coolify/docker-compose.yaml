# Coolify Docker Compose for RedPlanet Core
# Deploy via Coolify's Docker Compose build pack
# Documentation: https://github.com/RedPlanetHQ/core

services:
  core:
    image: redplanethq/core:${VERSION}
    environment:
      # Image version (set in Coolify UI)
      - VERSION=${VERSION:-0.1.32}
      # App configuration
      - NODE_ENV=production
      - APP_ENV=production
      - REMIX_APP_PORT=3000

      # URLs - auto-resolved from Coolify domain config
      - LOGIN_ORIGIN=${SERVICE_URL_CORE}
      - APP_ORIGIN=${SERVICE_URL_CORE}
      - API_BASE_URL=${SERVICE_URL_CORE}
      - CORE_LOGIN_ORIGIN=${SERVICE_URL_CORE}
      - CORE_APP_ORIGIN=${SERVICE_URL_CORE}

      # Database - auto-generated credentials
      - DATABASE_URL=postgresql://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/${POSTGRES_DB:-core}?schema=core
      - DIRECT_URL=postgresql://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/${POSTGRES_DB:-core}?schema=core
      - POSTGRES_DB=${POSTGRES_DB:-core}

      # Redis - auto-generated password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${SERVICE_PASSWORD_REDIS}
      - REDIS_TLS_DISABLED=true

      # Neo4j - auto-generated credentials
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=${SERVICE_PASSWORD_NEO4J}

      # Secrets - auto-generated
      - SESSION_SECRET=${SERVICE_BASE64_64_SESSION}
      - ENCRYPTION_KEY=${SERVICE_BASE64_64_ENCRYPTION}
      - MAGIC_LINK_SECRET=${SERVICE_BASE64_64_MAGIC}

      # AI Provider - set in Coolify UI (required)
      - OPENAI_API_KEY=${OPENAI_API_KEY:?}

      # Embedding configuration
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-3-small}
      - EMBEDDING_MODEL_SIZE=${EMBEDDING_MODEL_SIZE:-1536}
      - MODEL=${MODEL:-gpt-4.1-2025-04-14}

      # Optional: Local Ollama (if using ollama service)
      - OLLAMA_URL=${OLLAMA_URL:-}

      # Optional: Reranking
      - RERANK_PROVIDER=${RERANK_PROVIDER:-none}
      - COHERE_API_KEY=${COHERE_API_KEY:-}
      - COHERE_RERANK_MODEL=${COHERE_RERANK_MODEL:-rerank-english-v3.0}

      # Optional: Google OAuth - set in Coolify UI
      - AUTH_GOOGLE_CLIENT_ID=${AUTH_GOOGLE_CLIENT_ID:-}
      - AUTH_GOOGLE_CLIENT_SECRET=${AUTH_GOOGLE_CLIENT_SECRET:-}

      # Email login
      - ENABLE_EMAIL_LOGIN=${ENABLE_EMAIL_LOGIN:-true}

      # Optional: Email via Resend
      - EMAIL_TRANSPORT=${EMAIL_TRANSPORT:-}
      - FROM_EMAIL=${FROM_EMAIL:-}
      - REPLY_TO_EMAIL=${REPLY_TO_EMAIL:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}

      # Queue
      - QUEUE_PROVIDER=bullmq

      # Telemetry
      - TELEMETRY_ENABLED=${TELEMETRY_ENABLED:-false}
      - TELEMETRY_ANONYMOUS=${TELEMETRY_ANONYMOUS:-true}

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      # Using nc (netcat) since wget/curl not available in image
      test: ["CMD-SHELL", "nc -z localhost 3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - traefik.enable=true
      - traefik.http.services.core.loadbalancer.server.port=3000

  postgres:
    image: postgres:16-alpine
    expose:
      - "5432"
    environment:
      - POSTGRES_USER=${SERVICE_USER_POSTGRES}
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - POSTGRES_DB=${POSTGRES_DB:-core}
    volumes:
      - type: bind
        source: ./postgres-data
        target: /var/lib/postgresql/data
        is_directory: true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    command: redis-server --requirepass ${SERVICE_PASSWORD_REDIS}
    volumes:
      - type: bind
        source: ./redis-data
        target: /data
        is_directory: true
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${SERVICE_PASSWORD_REDIS}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  neo4j:
    image: redplanethq/neo4j:0.1.0
    expose:
      - "7687"
      - "7474"
    environment:
      - NEO4J_AUTH=neo4j/${SERVICE_PASSWORD_NEO4J}
      - NEO4J_dbms_security_procedures_unrestricted=gds.*,apoc.*
      - NEO4J_dbms_security_procedures_allowlist=gds.*,apoc.*
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use_neo4j_config=true
      # Hardcoded for now - Coolify variable substitution causes issues with Neo4j env parsing
      - NEO4J_server_memory_heap_initial__size=1G
      - NEO4J_server_memory_heap_max__size=2G
    volumes:
      - type: bind
        source: ./neo4j-data
        target: /data
        is_directory: true
    healthcheck:
      # Neo4j HTTP API check - more reliable than cypher-shell with dynamic passwords
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 90s
